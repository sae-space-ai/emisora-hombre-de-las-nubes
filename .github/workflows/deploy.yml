name: Verificar radio y publicidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Vercel despliega directamente desde GitHub: no necesita un segundo despliegue
# con credenciales redundantes. Este flujo prueba la misma fuente que compila Vercel.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias
        run: npm ci
      - name: Tipos TypeScript
        run: npm run typecheck
      - name: Comprobar intercalado publicitario
        run: npm run test:ads
      - name: Compilar
        run: npm run build
